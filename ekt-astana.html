<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Кабель силовой для стационарной прокладки — Электрокомплект</title>
<style>
  :root {
    --ink: #1a2433;
    --paper: #eef2f6;
    --surface: #ffffff;
    --red: #d0121a;
    --muted: #5c6b7a;
    --line: #d5dce4;
    --on: #f4f7fb;
    --nav: #0d4e92;
    --soft: #f7f9fb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    line-height: 1.45;
  }
  button, [role="button"] { cursor: pointer; font: inherit; }
  button:disabled { cursor: not-allowed; opacity: 0.45; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 2px;
  }
  a { color: inherit; }
  h1, h2, p { text-wrap: pretty; }
  ::selection { background: var(--red); color: #fff; }

  .top, .bar, .nav { display: flex; align-items: center; }
  .top {
    height: 36px;
    justify-content: space-between;
    gap: 12px;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .top a { text-decoration: underline; text-decoration-color: var(--red); text-underline-offset: 3px; }
  .top select {
    border: 0;
    background: transparent;
    font: inherit;
    font-weight: 650;
    color: var(--ink);
  }
  .muted { color: var(--muted); }
  .bar {
    height: 68px;
    gap: 16px;
    padding: 0 20px;
    background: var(--surface);
  }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; flex: none; line-height: 1.15; }
  .logo b { letter-spacing: 0.04em; font-size: 14px; }
  .mark {
    width: 36px; height: 36px; background: var(--nav); color: #fff;
    display: grid; place-items: center; font-weight: 700; position: relative;
  }
  .mark i { position: absolute; right: 6px; top: 8px; width: 5px; height: 20px; background: var(--red); }
  .bar input {
    flex: 1;
    height: 44px;
    border: 1px solid var(--line);
    background: var(--paper);
    padding: 0 14px;
    font: inherit;
    color: var(--ink);
  }
  .bar input::placeholder { color: var(--muted); }
  .cartlink {
    display: flex; align-items: center; gap: 8px;
    text-decoration: none; min-height: 44px; font-weight: 600;
  }
  .cartlink b {
    min-width: 22px; height: 22px; padding: 0 6px;
    display: inline-grid; place-items: center;
    background: var(--red); color: #fff; font-size: 12px;
  }
  .nav {
    gap: 0; overflow: auto; background: var(--nav); color: var(--on);
    padding: 0 8px; font-size: 14px;
  }
  .nav span {
    display: inline-flex; align-items: center; height: 44px;
    padding: 0 14px; white-space: nowrap; color: rgba(244,247,251,.82);
  }
  .nav span.on { background: rgba(255,255,255,.14); color: #fff; font-weight: 650; }

  main { flex: 1; overflow: auto; padding-bottom: 128px; }
  .crumb { background: var(--surface); border-bottom: 1px solid var(--line); padding: 20px; }
  .crumb h1 { font-size: 28px; font-weight: 650; margin: 8px 0 0; letter-spacing: -0.02em; }
  .crumb p { margin: 8px 0 0; max-width: 42rem; }
  .layout { display: grid; }
  @media (min-width: 900px) {
    .layout { grid-template-columns: 248px minmax(0, 1fr); align-items: start; }
  }
  aside {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 16px 20px 20px;
  }
  @media (min-width: 900px) {
    aside { border-right: 1px solid var(--line); border-bottom: 0; position: sticky; top: 0; }
  }
  aside > b { display: block; margin-bottom: 4px; }
  .flabel { margin: 14px 0 0; font-size: 12px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip, .quiet, .buy, .primary {
    min-height: 44px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    padding: 8px 12px;
  }
  .chip.on { background: var(--ink); color: var(--on); border-color: var(--ink); }
  .check { display: flex; gap: 8px; align-items: center; min-height: 44px; margin-top: 12px; }
  .row {
    display: grid;
    gap: 12px;
    padding: 16px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .row:hover { background: var(--soft); }
  @media (min-width: 700px) {
    .row { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
    .buybox { text-align: right; min-width: 180px; }
  }
  .name { font-size: 16px; font-weight: 650; margin: 4px 0; }
  .meta { margin: 0; font-size: 14px; }
  .stock { margin: 6px 0 0; font-variant-numeric: tabular-nums; }
  .stock.out { color: var(--muted); }
  .price { color: var(--red); font-size: 20px; font-weight: 700; margin: 0 0 8px; font-variant-numeric: tabular-nums; }
  .price span { font-size: 14px; font-weight: 400; }
  .buy {
    background: var(--red); color: #fff7f7; border-color: var(--red); font-weight: 650;
    min-width: 132px;
  }
  .buy:hover, .primary:hover { background: var(--ink); border-color: var(--ink); }
  .quiet:hover, .chip:hover { border-color: var(--ink); }
  .terms { display: grid; background: var(--surface); border-top: 1px solid var(--line); }
  @media (min-width: 800px) { .terms { grid-template-columns: 1fr 1fr 1fr; } }
  .terms article { padding: 22px 20px; border-bottom: 1px solid var(--line); }
  @media (min-width: 800px) {
    .terms article + article { border-left: 1px solid var(--line); }
  }
  .terms h2 { margin: 0; font-size: 16px; }
  .terms p { margin: 8px 0 0; }
  .foot { padding: 18px 20px 28px; font-size: 12px; color: var(--muted); }
  .empty { padding: 28px 20px; }

  .foreman {
    position: fixed; right: 16px; bottom: 16px; z-index: 30;
    display: flex; align-items: flex-end; gap: 10px;
  }
  .foreman button { border: 0; background: transparent; padding: 0; }
  .foreman img {
    width: 96px; height: 96px; border-radius: 50%;
    object-fit: cover; object-position: center 18%;
    border: 1px solid var(--line); background: #f3efe6;
    display: block;
  }
  .bubble {
    max-width: 200px; background: #fff; border: 1px solid var(--line);
    padding: 10px 12px; font-weight: 650; text-align: left; color: var(--ink);
    position: relative;
  }
  .bubble::after {
    content: "";
    position: absolute; right: -7px; bottom: 18px;
    width: 12px; height: 12px; background: #fff;
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    transform: rotate(-45deg);
  }
  .rise { animation: rise 1.5s ease-out both; }
  @keyframes rise {
    0% { transform: translateY(140%); }
    40% { transform: translateY(0); }
    55% { transform: rotate(-8deg) scale(1.04); }
    70% { transform: rotate(6deg); }
    100% { transform: none; }
  }
  .pop { animation: pop .35s ease-out both; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .sheet {
    position: fixed; z-index: 40; inset: 0;
    display: flex; justify-content: flex-end; align-items: flex-end;
    background: rgba(26,36,51,.45);
  }
  @media (min-width: 700px) {
    .sheet { background: transparent; pointer-events: none; }
    .panel { pointer-events: auto; margin: 16px; height: min(640px, calc(100dvh - 32px)) !important; width: 384px; }
  }
  .panel {
    width: 100%; height: 100dvh; background: #fff; border: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .ph { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .ph img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; object-position: center 18%; }
  .ph h2 { margin: 0; font-size: 16px; }
  .ph p { margin: 0; font-size: 12px; }
  .msgs { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
  .msgs p { margin: 0 0 8px; }
  .me { margin-left: 28px; background: var(--ink); color: var(--on); padding: 10px 12px; }
  .sku { font-size: 12px; color: var(--muted); letter-spacing: 0.01em; }
  .card { border: 1px solid var(--line); border-left: 3px solid var(--red); padding: 12px; margin-top: 8px; background: var(--soft); }
  .card p { margin: 8px 0; }
  .primary { background: var(--red); color: #fff; border-color: var(--red); font-weight: 650; }
  .composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); background: #fff; }
  .composer textarea {
    flex: 1; min-height: 44px; resize: none; border: 1px solid var(--line);
    padding: 8px 10px; font: inherit; color: var(--ink);
  }
  .hide { display: none !important; }
  .nodes {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
    padding: 10px 12px 12px; background: var(--paper); border-bottom: 1px solid var(--line);
    font-size: 12px; text-align: center; color: var(--muted);
  }
  .dot {
    width: 28px; height: 28px; margin: 0 auto 4px; display: grid; place-items: center;
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .dot.done { background: var(--ink); color: #fff; border-color: var(--ink); }
  .dot.wait { border: 2px solid var(--red); color: var(--ink); font-weight: 700; background: #fff; }
  .nodes .cap { grid-column: 1 / -1; text-align: left; margin: 8px 0 0; }
  .qty {
    height: 44px; width: 88px; border: 1px solid var(--line);
    padding: 0 8px; font: inherit; font-variant-numeric: tabular-nums;
  }
  @media (max-width: 699px) {
    .bar { padding: 0 12px; gap: 8px; }
    .logo b { font-size: 12px; }
    .crumb, .row, aside { padding-left: 12px; padding-right: 12px; }
    .crumb h1 { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rise, .pop { animation: none; }
  }
</style>
</head>

const CITIES = [
  ["almaty","Алматы"],["astana","Астана"],["karaganda","Караганда"],["shymkent","Шымкент"]
];
const TERMS = "Оплата. Юрлицам — счёт, частным покупателям — Kaspi Pay. Новому клиенту предоплата 100%. Отсрочка только по договору, не из чата. Доставка. Самовывоз в день заказа до 16:00, если кабель есть на складе города. По Астане на следующий рабочий день от 30 000 ₸, иначе 2 000 ₸. В другие города 2–5 рабочих дней. Партия. Силовой кабель — от 1 м. Бухта 300 м в названии — заводская намотка, в чате режем метрами.";
const state = { city: "astana", q: "", cores: "", section: "", metal: "", only: false, cart: [], view: "catalog", chat: false, pending: null, messages: [], trace: "idle" };

function money(n){ return new Intl.NumberFormat("ru-KZ").format(n) + " ₸"; }
function cityName(){ return CITIES.find(c => c[0] === state.city)[1]; }
function spec(p, label){ return (p.specs.find(s => s.label === label) || {}).value || ""; }
function get(sku){ return PRODUCTS.find(p => p.sku === sku); }
function norm(s){
  return String(s).toLowerCase().replace(/ё/g,"е")
    .replace(/(\d)\s*[xх×*]\s*(\d+(?:[.,]\d+)?)/g, (_,a,b) => a + "x" + b.replace(",","."))
    .replace(/,/g,".").replace(/\s+/g," ").trim();
}
function score(raw, p){
  const q = norm(raw);
  const hay = norm(p.sku + " " + p.name + " " + p.tags + " " + p.specs.map(s => s.value).join(" "));
  let n = 0;
  const compact = p.sku.toLowerCase().replace(/[^a-z0-9]/g,"");
  if (compact.length > 4 && q.replace(/[^a-z0-9]/g,"").includes(compact)) n += 70;
  q.split(/[^a-z0-9а-я.]+/).filter(t => t.length > 1).forEach(t => { if (hay.includes(t)) n += t.length > 3 ? 8 : 4; });
  const dim = q.match(/(\d)x(\d+(?:\.\d+)?)/);
  if (dim) n += hay.includes(dim[1] + "x" + dim[2]) ? 30 : -18;
  return n;
}
function best(raw){
  return PRODUCTS.map(p => ({p, n: score(raw, p)})).filter(r => r.n >= 8).sort((a,b) => b.n - a.n)[0];
}
function yes(raw){
  const t = norm(raw).replace(/[.,!?]+/g," ").trim();
  return /^(да|хорошо|верно|подтверждаю|добавляй|добавьте|добавь)( добав\S*| в корзину)?$/.test(t) && !/\d/.test(t);
}
function no(raw){ return /^(нет|не надо|не сейчас|отмена|не добавляй)[.!\s]*$/.test(norm(raw)); }
function qtyOf(raw){
  const m = norm(raw).match(/(\d+)\s*м\b/);
  return m ? Math.max(1, Number(m[1])) : null;
}

function renderCity(){
  const sel = document.getElementById("city");
  sel.innerHTML = CITIES.map(c => `<option value="${c[0]}" ${c[0]===state.city?"selected":""}>${c[1]}</option>`).join("");
}
function renderCartN(){ document.getElementById("cartn").textContent = state.cart.length; }

function catalogHtml(){
  const list = PRODUCTS.filter(p => {
    if (state.q && score(state.q, p) < 8) return false;
    if (state.cores && spec(p,"Жилы") !== state.cores) return false;
    if (state.section && !spec(p,"Сечение").startsWith(state.section)) return false;
    if (state.metal && spec(p,"Материал") !== state.metal) return false;
    if (state.only && p.stock[state.city] <= 0) return false;
    return true;
  });
  const chip = (group, value, label) => `<button type="button" class="chip ${state[group]===value?"on":""}" data-g="${group}" data-v="${value}">${label}</button>`;
  const rows = list.map(p => {
    const here = p.stock[state.city];
    const held = (state.cart.find(l => l.sku === p.sku) || {}).qty || 0;
    return `<article class="row">
      <div>
        <div class="sku">Код товара ${p.sku}</div>
        <h2 class="name">${p.name}</h2>
        <p class="meta muted">${p.specs.slice(0,4).map(s => s.value).join(" · ")}</p>
        <p class="stock ${here > 0 ? "" : "out"}">${here > 0 ? cityName() + " · " + here + " м" : "Под заказ"}</p>
      </div>
      <div class="buybox">
        <p class="price">${money(p.price)}<span class="muted">/м</span></p>
        ${here > 0
          ? `<button class="buy" type="button" data-buy="${p.sku}">${held ? "Купить · " + held : "Купить"}</button>`
          : `<button class="quiet" type="button" data-ask="${p.sku}">Подобрать аналог</button>`}
      </div>
    </article>`;
  }).join("") || `<p class="empty">В этой выборке нет совпадений.</p>`;
  return `<section class="crumb" id="catalog">
      <div class="muted">Кабель / Провод / Кабель силовой для стационарной прокладки</div>
      <h1>Кабель силовой для стационарной прокладки</h1>
      <p class="muted">Медный ВВГ и ВВГнг, плюс АСБл под заказ. Цены — срез публичной витрины, не оферта.</p>
      <p>Прораб выйдет через минуту из правого нижнего угла.</p>
    </section>
    <div class="layout">
      <aside>
        <b>Фильтр по параметрам</b>
        <div class="flabel">Количество жил</div>
        <div class="chips">${["2","3","5"].map(v => chip("cores", v, v)).join("")}</div>
        <div class="flabel">Сечение, мм²</div>
        <div class="chips">${["1,5","2,5","4","6","120","240"].map(v => chip("section", v, v)).join("")}</div>
        <div class="flabel">Материал жилы</div>
        <div class="chips">${["Медь","Алюминий"].map(v => chip("metal", v, v)).join("")}</div>
        <label class="check">
          <input type="checkbox" id="only" ${state.only?"checked":""} /> Только в наличии здесь
        </label>
      </aside>
      <div>${rows}</div>
    </div>
    <section class="terms" id="terms">
      <article><h2>Оплата</h2><p class="muted">Юрлицам — счёт, частным покупателям — Kaspi Pay. Новому клиенту предоплата 100%.</p></article>
      <article><h2>Доставка</h2><p class="muted">Самовывоз до 16:00, если кабель есть на складе. По Астане от 30 000 ₸ на следующий рабочий день.</p></article>
      <article><h2>Минимальная партия</h2><p class="muted">Силовой кабель — от 1 м. Бухта 300 м в названии режется метрами.</p></article>
    </section>
    <p class="foot">ГК Электрокомплект · один HTML-файл. Остатки заданы для демонстрации ассистента и не являются офертой ekt.kz.</p>`;
}

function cartHtml(){
  if (!state.cart.length) return `<section class="crumb"><h1>Корзина</h1><p>Корзина пустая. Прораб добавит кабель только после подтверждения.</p><p><a href="#catalog">В каталог</a></p></section>`;
  const lines = state.cart.map(l => {
    const p = get(l.sku);
    return `<article class="row">
      <div><div class="sku">${p.sku}</div><b>${p.name}</b><div>${money(p.price)}/м</div></div>
      <div class="buybox">
        <input class="qty" aria-label="Количество" data-qty="${p.sku}" type="number" min="1" max="${p.stock[state.city]}" value="${l.qty}" />
        <div>${money(p.price * l.qty)}</div>
        <button class="quiet" type="button" data-del="${p.sku}">Убрать</button>
      </div>
    </article>`;
  }).join("");
  const sum = state.cart.reduce((s,l) => s + get(l.sku).price * l.qty, 0);
  return `<section class="crumb"><h1>Корзина</h1><p class="muted">Ссылка на это состояние: фрагмент #cart. Заказ никуда не отправляется.</p></section>${lines}
    <p style="padding:16px"><b>Сумма ${money(sum)}</b></p>
    <p class="foot">Оформление в этом файле закрыто. Платёжные данные не запрашиваются.</p>`;
}

function paint(){
  renderCity();
  renderCartN();
  if (document.activeElement !== document.getElementById("q")) document.getElementById("q").value = state.q;
  document.getElementById("main").innerHTML = state.view === "cart" ? cartHtml() : catalogHtml();
  document.getElementById("sheet").classList.toggle("hide", !state.chat);
  paintChat();
  paintForeman();
}

function paintForeman(){
  const box = document.getElementById("foreman");
  if (state.chat || state.foreman === "wait") { box.classList.add("hide"); return; }
  box.classList.remove("hide");
  box.innerHTML = `${state.foreman === "talk" ? `<button class="bubble pop" type="button" id="bubble">Может вам помочь?</button>` : ""}
    <button class="rise" type="button" id="face" aria-label="Может вам помочь?"><img src="${FACE}" alt="" /></button>`;
}

const NODE = ["План","Каталог","Аналог","Условия","Корзина"];
function paintChat(){
  const nodes = document.getElementById("nodes");
  const marks = { idle: [], run: [], done: ["План","Каталог"], wait: ["Корзина"], off: [], terms: ["План","Каталог","Условия"], analog: ["План","Каталог","Аналог"] };
  const set = state.trace === "wait" ? ["План","Каталог"] : state.trace === "done" ? ["План","Каталог","Корзина"] : state.trace === "off" ? ["План","Каталог"] : (marks[state.trace] || []);
  nodes.innerHTML = NODE.map((name,i) => {
    let cls = "";
    if (state.trace === "wait" && name === "Корзина") cls = "wait";
    else if (state.trace === "off" && name === "Корзина") cls = "";
    else if (set.includes(name)) cls = "done";
    return `<div><div class="dot ${cls}">${i+1}</div>${name}</div>`;
  }).join("") + `<p class="muted cap">${caption()}</p>`;
  const msgs = document.getElementById("msgs");
  const welcome = `<article><p>Я прораб со склада в Астане. По силовому кабелю скажу наличие, сечение, сертификат и чем заменить, если позиция под заказ. В корзину положу только после «да, добавь».</p>
    <div class="chips" style="margin-top:8px">
      ${["Есть ВВГ 3х2,5 0,66 кВ? Характеристики и сертификат","ВВГп нг(А)-LS 3х2,5 в Астане нет — чем заменить?","Условия оплаты, доставки и минимальная партия","Добавь 30 м кабеля ВВГ 3х2,5"].map(t => "<button class='quiet' type='button' data-chip='" + t + "'>" + t + "</button>").join("")}
    </div></article>`;
  msgs.innerHTML = welcome + state.messages.map(m => m.role === "user"
    ? `<article class="me">${escapeHtml(m.text)}</article>`
    : `<article>${m.html}</article>`).join("");
  msgs.scrollTop = msgs.scrollHeight;
  document.getElementById("ava").src = FACE;
  document.getElementById("draft").placeholder = state.pending ? "Подтвердите паузу или напишите «нет»" : "Спросите про наличие, аналог или условия";
}
function caption(){
  if (state.trace === "wait") return "Узел «Корзина» на interrupt(). Запись ещё не выполнена.";
  if (state.trace === "done") return "Узел «Корзина» запущен снова. Количество записано.";
  if (state.trace === "off") return "interrupt() вернул отмену. Корзина не менялась.";
  if (state.trace === "terms") return "Пройдено: План → Каталог → Условия.";
  if (state.trace === "analog") return "Пройдено: План → Каталог → Аналог.";
  if (state.trace === "done-info") return "Пройдено: План → Каталог.";
  return "Пять узлов. Запись корзины — в том же узле, после interrupt().";
}
function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({"&":"&","<":"<",">":">"}[c])); }

function blurb(p){
  const here = p.stock[state.city];
  const bits = p.specs.map(s => s.value).join(", ");
  let text = `${p.name}, код ${p.sku}: ${money(p.price)}/м. ${cityName()} — ${here > 0 ? here + " м" : "нет, под заказ"}. ${bits}.`;
  if (p.certificate) text += ` Сертификат ${p.certificate.code}, действует до ${p.certificate.validUntil.split("-").reverse().join(".")}.`;
  return text;
}
function analogs(p){
  return p.analogs.map(a => ({ a, p: get(a.sku) })).filter(x => x.p && x.p.stock[state.city] > 0);
}

function reply(raw){
  const text = raw.trim();
  if (!text) return;
  state.messages.push({ role: "user", text });
  if (state.pending && no(text)) {
    state.pending = null;
    state.trace = "off";
    state.messages.push({ role: "bot", html: "<p>Корзину не меняю.</p>" });
    return;
  }
  if (state.pending && yes(text)) { commit(state.pending.lines); return; }
  if (state.pending) {
    state.trace = "wait";
    state.messages.push({ role: "bot", html: "<p>Узел «Корзина» всё ещё на interrupt(). Запись не выполнена. Подтвердите карточку или напишите «нет».</p>" });
    return;
  }
  const add = /добав|положи|закаж|в корзину/.test(norm(text));
  const wantTerms = /оплат|достав|парти|услови/.test(norm(text));
  const wantAnalog = /аналог|замен|чем замен/.test(norm(text));
  const hit = best(text);
  if (!hit && wantTerms) {
    state.trace = "terms";
    state.messages.push({ role: "bot", html: `<p>${TERMS}</p>` });
    return;
  }
  if (!hit) {
    state.trace = "idle";
    state.messages.push({ role: "bot", html: "<p>В этом разделе такой позиции нет. Напишите марку и сечение, например ВВГ 3х2,5.</p>" });
    return;
  }
  const p = hit.p;
  const here = p.stock[state.city];
  let html = `<p>${blurb(p)}</p>`;
  let trace = "done-info";
  const alts = analogs(p);
  if (here === 0 || wantAnalog) {
    trace = "analog";
    if (here === 0) html += `<p>На складе ${cityName()} нет, позиция под заказ. Отсюда добавить нельзя.</p>`;
    if (alts[0]) html += `<p>Аналог: ${alts[0].p.name}. ${alts[0].a.why}</p>`;
    else html += `<p>На этом складе равноценного аналога нет.</p>`;
  }
  if (wantTerms) { html += `<p>${TERMS}</p>`; trace = "terms"; }
  if (add && here > 0) {
    const ask = qtyOf(text) || 1;
    const prev = (state.cart.find(l => l.sku === p.sku) || {}).qty || 0;
    const room = here - prev;
    if (room <= 0) html += `<p>Остаток в ${cityName()} уже в корзине.</p>`;
    else {
      const qty = Math.min(ask, room);
      state.pending = { lines: [{ sku: p.sku, qty, capped: qty < ask, available: here }] };
      trace = "wait";
      html += proposalHtml();
    }
  }
  state.trace = trace;
  state.messages.push({ role: "bot", html });
}

function proposalHtml(){
  const line = state.pending.lines[0];
  const p = get(line.sku);
  return `<div class="card" id="hold">
    <div class="sku">interrupt() внутри узла «Корзина»</div>
    <p>Дальше агент не идёт. Подтвердить, поправить количество или отменить.</p>
    <p><b>${p.name}</b><br />${p.sku} · qty ${line.qty}<br />${money(p.price)}/м · ${money(p.price * line.qty)}</p>
    ${line.capped ? `<p class="muted">Больше остатка добавить нельзя: ${line.available} м</p>` : ""}
    <p class="muted">Цена в вызов не входит. Её считает склад.</p>
    <div class="chips">
      <button class="primary" type="button" id="ok">Да, добавить</button>
      <button class="quiet" type="button" id="later">Не сейчас</button>
    </div>
  </div>`;
}

function commit(lines){
  lines.forEach(line => {
    const p = get(line.sku);
    const prev = state.cart.find(l => l.sku === line.sku);
    const cap = p.stock[state.city];
    const next = Math.min(cap, (prev ? prev.qty : 0) + line.qty);
    if (prev) prev.qty = next; else state.cart.push({ sku: line.sku, qty: next });
  });
  state.pending = null;
  state.trace = "done";
  const p = get(lines[0].sku);
  state.messages.push({ role: "bot", html: `<p>Добавлено в корзину: ${p.name} — ${lines[0].qty} м. Количество не превышает остаток ${cityName()}.</p><p><a href="#cart" id="tocart">Открыть корзину</a></p>` });
}

function openChat(){ state.chat = true; state.foreman = "talk"; paint(); }
function ask(text){ state.chat = true; reply(text); paint(); }

document.getElementById("city").addEventListener("change", e => { state.city = e.target.value; state.pending = null; paint(); });
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; state.view = "catalog"; paint(); });
document.getElementById("home").addEventListener("click", e => { e.preventDefault(); state.view = "catalog"; location.hash = "catalog"; paint(); });
document.getElementById("cartbtn").addEventListener("click", e => { e.preventDefault(); state.view = "cart"; location.hash = "cart"; paint(); });
document.getElementById("foreman").addEventListener("click", () => { state.chat = true; paint(); });
document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const draft = document.getElementById("draft");
  const value = draft.value;
  draft.value = "";
  ask(value);
});
document.getElementById("main").addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.g) {
    state[t.dataset.g] = state[t.dataset.g] === t.dataset.v ? "" : t.dataset.v;
    paint();
  } else if (t.dataset.buy) {
    const p = get(t.dataset.buy);
    const prev = state.cart.find(l => l.sku === p.sku);
    const next = Math.min(p.stock[state.city], (prev ? prev.qty : 0) + 1);
    if (prev) prev.qty = next; else if (next) state.cart.push({ sku: p.sku, qty: next });
    paint();
  } else if (t.dataset.ask) {
    const p = get(t.dataset.ask);
    ask(`Чем заменить ${p.name}, код ${p.sku}?`);
  } else if (t.dataset.del) {
    state.cart = state.cart.filter(l => l.sku !== t.dataset.del);
    paint();
  }
});
document.getElementById("main").addEventListener("change", e => {
  if (e.target.id === "only") { state.only = e.target.checked; paint(); }
  if (e.target.dataset.qty) {
    const p = get(e.target.dataset.qty);
    const line = state.cart.find(l => l.sku === p.sku);
    if (!line) return;
    line.qty = Math.max(1, Math.min(p.stock[state.city], Math.round(Number(e.target.value) || 1)));
    paint();
  }
});
document.getElementById("sheet").addEventListener("click", e => {
  const chip = e.target.dataset && e.target.dataset.chip;
  if (chip) ask(chip);
  if (e.target.id === "ok" && state.pending) { commit(state.pending.lines); paint(); }
  if (e.target.id === "later") { state.pending = null; state.trace = "off"; state.messages.push({ role:"bot", html:"<p>Корзину не меняю.</p>"}); paint(); }
  if (e.target.id === "tocart") { e.preventDefault(); state.view = "cart"; state.chat = false; location.hash = "cart"; paint(); }
});

state.foreman = "wait";
paint();
const started = Number(sessionStorage.getItem("ekt-html-start")) || Date.now();
sessionStorage.setItem("ekt-html-start", String(started));
const left = Math.max(0, 60000 - (Date.now() - started));
setTimeout(() => { state.foreman = "in"; paint(); }, left);
setTimeout(() => { state.foreman = "talk"; paint(); }, left + 1400);
setTimeout(() => { state.chat = true; paint(); }, left + 3600);
if (location.hash === "#cart") { state.view = "cart"; paint(); }
</script>
</body>
</html>
